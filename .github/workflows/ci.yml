name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check src/server.js
      - run: npm run demo
      - run: npm audit --omit=dev
      - run: docker build -t intake-ci .
      - name: Verify both demo entrypoints in the runtime image without external networking
        run: docker run --rm --network none -v "$PWD/tests/demo.test.js:/app/tests/demo.test.js:ro" intake-ci node --test tests/demo.test.js
